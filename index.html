<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111e2d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"><title>DAILY｜主管行程</title></head><body>
<header><div class="brand">DAILY <span>主管工作台</span></div><p>今日行程・人員追蹤・工作回報</p><div id="connection" role="status">尚未登入</div></header>
<main><section id="loginPanel" class="panel"><h1>主管登入</h1><p>使用 Firebase 中建立的主管帳號。密碼是這個工作台的專用密碼，不是 Gmail 應用程式密碼。</p><form id="loginForm"><label>主管信箱<input id="email" type="email" autocomplete="username" required></label><label>工作台專用密碼<input id="password" type="password" autocomplete="current-password" required></label><button>登入工作台</button></form><p id="loginError" role="alert"></p></section>
<section id="workspace" hidden><div class="toolbar"><button id="refresh">重新整理</button><button id="logout" class="secondary">登出</button></div><div id="syncInfo" class="notice"></div><div class="panel filters"><label>查看日期<input id="day" type="date"></label><label>承辦人<select id="owner"><option value="">全體人員</option></select></label><label>顯示範圍<select id="scope"><option value="day">選定日期</option><option value="overdue">逾期待辦</option><option value="missing">待補資料</option><option value="all">已同步全部</option></select></label><label class="check"><input id="showDone" type="checkbox">包含已完成</label></div><div id="stats" class="stats"></div><div id="tasks"></div><section class="panel"><h2>最近回報</h2><p>雲端收到後，需等電腦啟動 DAILY 並同步，才會顯示「電腦已同步」。</p><div id="reports"></div></section></section></main>
<dialog id="editor"><form id="reportForm"><div class="toolbar"><h2 id="editTitle">回報工作</h2><button type="button" id="closeEditor" class="secondary">關閉</button></div><p id="editMeta"></p><p id="editNote" class="notes"></p><p id="formalWarning" class="notice" hidden>此項為正式流程。手機回報只記錄處理結果，換約／保證金／案件完成仍由電腦來源流程核對。</p><label>處理狀態<select id="action"><option value="紀錄">記錄處理結果</option><option value="待追蹤">待追蹤</option><option value="完成">本次工作已完成</option></select></label><label>結果／補充內容<textarea id="result" rows="7" maxlength="10000" required></textarea></label><label>下次追蹤日期<input id="nextDate" type="date"></label><button id="submitReport">送出回報</button><p id="reportError" role="alert"></p></form></dialog>
<footer>提醒使用 Google 行事曆｜操作人為主管，原承辦人保持不變</footer><script type="module" src="./app.js"></script></body></html>
